// @description  A chart-first desk for long calls and puts, built on Trend & Structure (HMA cloud, Zig Zag Dynamic channels, Breadth Divergence, VolCX) and its Trade Score with the 20/90-day volume profile. A scanner for coiled stocks with cheap 2–4 week options, a stop set on the stock from ATR, ADR and IV, position size from your risk, and trading through Tradier with take profit, a backup stop at Tradier and a stock-level stop it watches for you. Dealer gamma (GEX) levels and read, news and alerts like the cockpit's, and every part of the chart on or off.
// @author       Hyphen-C

/*  H-C COIL — Trend & Structure Options Desk
 *  The TradingView "Trend & Structure" script (Hull cloud + Zig Zag Dynamic + Breadth Divergence Panel + VolCX + Trade
 *  Score) rebuilt on Tradier data, with an options layer for buying coiled setups cheaply.
 *  Data and trading: Tradier API. Your Tradier token lives in Tampermonkey storage, never in this file.
 *  Runs on its own page: save hc-coil.html anywhere (for example Desktop\KC\hc-coil.html) and open it in Chrome.
 */
(function () {
'use strict';

/* ============================================================
 * COIL ENGINE — pure analytics, no DOM, no network
 * ============================================================ */
const COIL_ENGINE = (function () {
  'use strict';

  // ───────────────────────── basics ─────────────────────────
  const isNum = (x) => typeof x === 'number' && isFinite(x);
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  function sum(a) { let s = 0; for (let i = 0; i < a.length; i++) s += a[i]; return s; }
  function mean(a) { return a.length ? sum(a) / a.length : NaN; }
  function variance(a) {
    const n = a.length; if (n < 2) return NaN;
    const m = mean(a); let v = 0;
    for (let i = 0; i < n; i++) { const d = a[i] - m; v += d * d; }
    return v / (n - 1);
  }
  function stdev(a) { return Math.sqrt(variance(a)); }
  function median(a) {
    if (!a.length) return NaN;
    const s = Array.from(a).sort((x, y) => x - y); const m = s.length >> 1;
    return s.length % 2 ? s[m] : 0.5 * (s[m - 1] + s[m]);
  }
  function pctRank(arr, x) {
    if (!arr.length || !isNum(x)) return NaN;
    let c = 0; for (const v of arr) if (v <= x) c++;
    return c / arr.length;
  }
  function linreg(xs, ys) {
    const n = Math.min(xs.length, ys.length); if (n < 3) return null;
    const mx = mean(xs), my = mean(ys);
    let sxx = 0, syy = 0, sxy = 0;
    for (let i = 0; i < n; i++) { const dx = xs[i] - mx, dy = ys[i] - my; sxx += dx * dx; syy += dy * dy; sxy += dx * dy; }
    if (sxx <= 0) return null;
    return { slope: sxy / sxx, intercept: my - (sxy / sxx) * mx, r: (syy > 0) ? sxy / Math.sqrt(sxx * syy) : 0, n };
  }

  // ───────────────────────── normal dist ─────────────────────────
  const INV_SQRT2PI = 0.3989422804014327;
  function npdf(x) { return INV_SQRT2PI * Math.exp(-0.5 * x * x); }
  function ncdf(x) {
    // Hart (1968) double-precision cumulative normal (West 2005), ~1e-14
    const a = Math.abs(x);
    let c;
    if (a > 37) c = 0;
    else {
      const e = Math.exp(-a * a / 2);
      if (a < 7.07106781186547) {
        let b = 3.52624965998911e-02 * a + 0.700383064443688;
        b = b * a + 6.37396220353165; b = b * a + 33.912866078383; b = b * a + 112.079291497871;
        b = b * a + 221.213596169931; b = b * a + 220.206867912376;
        c = e * b;
        b = 8.83883476483184e-02 * a + 1.75566716318264;
        b = b * a + 16.064177579207; b = b * a + 86.7807322029461; b = b * a + 296.564248779674;
        b = b * a + 637.333633378831; b = b * a + 793.826512519948; b = b * a + 440.413735824752;
        c = c / b;
      } else {
        let b = a + 0.65; b = a + 4 / b; b = a + 3 / b; b = a + 2 / b; b = a + 1 / b;
        c = e / b / 2.506628274631;
      }
    }
    return x > 0 ? 1 - c : c;
  }

  // ───────────────────────── Black–Scholes ─────────────────────────
  // type 'C'|'P', T in years, r/q continuous, v = vol (decimal)
  function bsPrice(type, S, K, T, r, q, v) {
    if (!(S > 0) || !(K > 0)) return NaN;
    if (T <= 1e-8 || v <= 1e-6) {
      const t = Math.max(T, 0);
      const f = type === 'C' ? S * Math.exp(-q * t) - K * Math.exp(-r * t) : K * Math.exp(-r * t) - S * Math.exp(-q * t);
      return Math.max(0, f);
    }
    const sq = v * Math.sqrt(T);
    const d1 = (Math.log(S / K) + (r - q + 0.5 * v * v) * T) / sq;
    const d2 = d1 - sq;
    const dq = Math.exp(-q * T), dr = Math.exp(-r * T);
    return type === 'C' ? S * dq * ncdf(d1) - K * dr * ncdf(d2) : K * dr * ncdf(-d2) - S * dq * ncdf(-d1);
  }
  function bsDelta(type, S, K, T, r, q, v) {
    if (T <= 1e-8 || v <= 1e-6) { const itm = type === 'C' ? S > K : S < K; return itm ? (type === 'C' ? 1 : -1) : 0; }
    const sq = v * Math.sqrt(T);
    const d1 = (Math.log(S / K) + (r - q + 0.5 * v * v) * T) / sq;
    const dq = Math.exp(-q * T);

        : { k: 'IV', d: c.ivMult * sd * Math.sqrt(Math.max(1, c.hold)), txt: (c.ivMult === 1 ? '' : c.ivMult + '× ') + '1σ over ' + c.hold + ' day' + (c.hold === 1 ? '' : 's') + ' at IV' }
    ].filter(p => isNum(p.d) && p.d > 0);
    if (!parts.length) return null;
    const top = parts.reduce((a, p) => (p.d > a.d ? p : a), parts[0]), floor = top.d;
    let stop = spot + sgn * floor, lvl = null;
    const beyond = levels.filter(l => levelFor(l, 'stop', dir) && (dir === 'C' ? l.p <= spot - floor && l.p >= spot - floor - c.reach * atr : l.p >= spot + floor && l.p <= spot + floor + c.reach * atr));
    if (beyond.length) {

    const dist = Math.abs(spot - stop);
    return { dir, spot, stop, dist, distAtr: dist / atr, distPct: dist / spot * 100, floor, rule: top, parts, lvl, wide: dist > c.maxAtr * atr, sd, iv, hold: c.hold };
  }
  // The target: the first structure level at least 1.5 R away (R = the stop's distance) and no more than 4 R, else 2 R.
  // A level nearer than that is reported as the first thing in the way.
  function targetPlan(dir, spot, st, levels, cfg) {
    if (!st) return null;
    const c = Object.assign({}, STOP_DEF, cfg || {}), R = st.dist, sgn = dir === 'C' ? 1 : -1;
    const ahead = levels.filter(l => levelFor(l, 'target', dir) && sgn * (l.p - spot) > 1e-9).sort((a, b) => sgn * (a.p - b.p));
    const t = ahead.find(l => sgn * (l.p - spot) >= c.minRR * R - 1e-9 && sgn * (l.p - spot) <= 4 * R);
    const block = ahead.find(l => sgn * (l.p - spot) < c.minRR * R) || null;
    const target = t ? t.p : spot + sgn * 2 * R;

  }

  // ───────────────────────── the options: what's cheap, and which contract ─────────────────────────
  // "Cheap" is the implied vol in your 2–4 week window against what the stock itself usually does: its median HV20 over
  // the past year (IV ÷ typical), where today's IV would rank among the past year's HV20 readings, and — once COIL has
  // logged 20 days of it — the IV's rank in its own history. Coiled stocks tend to carry cheap options, and that's the
  // setup: buying volatility below its normal level before it expands. A term-structure kink (an earnings-type event)
  // inside the window props the IV up for a reason, so it's flagged and the score marked down.
  const OPT_DEF = { dteMin: 14, dteMax: 30, hold: 2, dMin: 0.30, dMax: 0.65, maxSpread: 0.12, minOI: 50, fill: 0.5, r: 0.04, q: 0, maxPrem: 0, risk: 200, maxOrder: 2500,
    backupFrac: 0.6, backupAtr: 1, tgtMin: 0.2 };
  function ivRankOf(hist, iv) {
    const xs = asArray(hist).map(h => +h.iv).filter(v => v > 0);
    if (xs.length < 20 || !isNum(iv)) return { n: xs.length, rank: NaN, pct: NaN };
    const mn = Math.min(...xs), mx = Math.max(...xs);
    return { n: xs.length, rank: mx > mn ? clamp((iv - mn) / (mx - mn), 0, 1) : 0.5, pct: pctRank(xs, iv), lo: mn, hi: mx };
  }
  function chainRead(chains, spot, nowMs, vr, cfg, ivHist) {
    const c = Object.assign({}, OPT_DEF, cfg || {});
    const exps = normalizeChains(chains, spot, nowMs, { r: c.r, q: c.q, strikeRange: 0.35 });
    const smiles = exps.map(x => buildSmile(x, spot, c.r, c.q));
    const ts = termStructure(smiles, vr && vr.hv20 > 0 ? vr.hv20 / 100 : null);
    const inWin = (x) => x.dte >= c.dteMin - 0.5 && x.dte <= c.dteMax + 0.99;
    const win = exps.filter(inWin), ivs = smiles.filter(inWin).map(s => s.atm).filter(v => isNum(v) && v > 0);
    const ivW = ivs.length ? median(ivs) : (isNum(ts.iv30) ? ts.iv30 : NaN);
    const ivTyp = vr && vr.hvMed > 0 ? vr.hvMed / 100 : NaN, ratio = ivW / ivTyp;
    const pctHv = vr && vr.hist.length >= 60 && isNum(ivW) ? pctRank(vr.hist, ivW * 100) : NaN;
    const ivr = ivRankOf(ivHist, ivW);
    const tMax = win.length ? Math.max(...win.map(x => x.T)) : NaN;
    const events = ts.events.filter(ev => isNum(tMax) && ev.T1 <= tMax + 1e-9);
    const parts = [[isNum(ratio) ? clamp((1.25 - ratio) / 0.5, 0, 1) : NaN, 0.5], [isNum(pctHv) ? 1 - pctHv : NaN, 0.3], [ivr.n >= 20 ? 1 - ivr.pct : NaN, 0.2]].filter(p => isNum(p[0]));
    let cheap = parts.length ? 100 * sum(parts.map(p => p[0] * p[1])) / sum(parts.map(p => p[1])) : NaN;
    if (events.length && isNum(cheap)) cheap *= 0.75;
    const tkc = {};
    // the increment class from the quotes only: a complex order can print an odd penny on a nickel contract, a quote can't
    asArray(chains).forEach(ch => { if (ch && ch.expiration) { const px = []; asArray(ch.options).forEach(o => { if (o) [o.bid, o.ask].forEach(v => px.push(v)); }); tkc[ch.expiration] = optTickClass(px); } });
    return { cfg: c, exps, smiles, ts, win, ivW, ivTyp, ratio, pctHv, ivr, events, cheap, tkc };
  }
  // one contract, priced for your plan: the stock at your stop and at your target after your hold, selling at the bid
  function evalOption(o, X) {
    const c = X.cfg, type = o.type, sgn = type === 'C' ? 1 : -1, S = X.spot;
    if (!(o.iv > 0) || !(o.bid > 0) || !(o.ask >= o.bid) || !(o.mid > 0)) return null;
    const g = bsGreeks(type, S, o.K, o.T, c.r, c.q, o.iv), ad = Math.abs(g.delta), spr = (o.ask - o.bid) / o.mid, tkc = X.tkc[o.exp] || 'nickel';
    const holdCal = c.hold * 7 / 5, Th = Math.max(o.T - holdCal / 365, 0.5 / 365);
    let entry = roundTick(o.mid + c.fill * (o.ask - o.mid), 'near', tkc);
    if (entry > o.ask) entry = o.ask; if (entry < o.bid) entry = o.bid;
    const half = (o.ask - o.bid) / 2;
    const val = (s, T) => bsPrice(type, Math.max(s, 0.01), o.K, T, c.r, c.q, o.iv);
    const vStop = val(X.stop, Th), vTgt = val(X.target, Th);
    const outStop = Math.max(vStop - half, 0), risk = entry - outStop, reward = Math.max(vTgt - half, 0) - entry, rr = risk > 0 ? reward / risk : NaN;
    // break-even after your hold: where selling at the bid gives the entry back
    let lo = S * 0.4, hi = S * 1.8;
    for (let i = 0; i < 60; i++) { const m = 0.5 * (lo + hi), f = val(m, Th) - half - entry; if ((f > 0) === (sgn > 0)) hi = m; else lo = m; }
    const beS = 0.5 * (lo + hi), beAtr = sgn * (beS - S) / X.vr.atr;
    const vTyp = isNum(X.ivTyp) ? bsPrice(type, S, o.K, o.T, c.r, c.q, X.ivTyp) : NaN, edge = vTyp / entry - 1;
    const theta = g.theta / 365, burn = -theta * holdCal / entry;
    // the backup at Tradier (for when COIL isn't running): the option's value 1 ATR past your stock stop, and at least
    // 40 % under your entry — far enough out that only a real move, not the open's spreads, reaches it
    const bkRaw = Math.min(val(X.stop - sgn * c.backupAtr * X.vr.atr, Th), c.backupFrac * entry);
    const backup = Math.max(optTick(Math.max(bkRaw, 0.01), tkc), roundTick(Math.max(bkRaw, 0.01), 'down', tkc));
    // the take-profit: the option's value with the stock at your target after the hold, at least +20 %
    const otgt = Math.max(roundTick(Math.max(vTgt, entry * (1 + c.tgtMin)), 'up', tkc), entry + optTick(entry, tkc));
    const perC = risk * 100, qty = perC > 0 ? Math.max(0, Math.floor(c.risk / perC)) : 0;
    const why = [];
    if (ad < c.dMin - 1e-9 || ad > c.dMax + 1e-9) why.push('delta');
    if (spr > c.maxSpread + 1e-9) why.push('spread');
    if (o.oi < c.minOI) why.push('open interest');
    if (c.maxPrem > 0 && entry > c.maxPrem + 1e-9) why.push('premium');
    if (!(risk > 0)) why.push('no risk read');
    else if (risk < 0.12 * entry) why.push('quote vs stop');       // barely moves at the stop: the quote and the stock disagree
    // v1.13.15: the chance of a profit, from the contract's own IV (the market's estimate of how far the stock moves; no view on
    // direction): the stock past the break-even after your hold, and past strike ± what you paid at expiry
    const popAt = (lvl, T) => { if (!(lvl > 0) || !(T > 0)) return NaN; const d2 = (Math.log(S / lvl) + (c.r - (c.q || 0) - 0.5 * o.iv * o.iv) * T) / (o.iv * Math.sqrt(T)); return ncdf(sgn * d2); };
    const popHold = popAt(beS, holdCal / 365), popExp = popAt(o.K + sgn * entry, o.T);
    // The fit score. Balanced (v1.13.14): what you pay to hold it weighs as much as what it could pay: the spread 25, reward
    // to risk 20 (full marks only at 3.5), time decay over the hold 20 (full at 5 % of the price or less, none at 35 %),
    // typical-vol value 15, open interest 8, delta near 0.45 7, break-even 5.
    // Probability (v1.13.15, Settings → Options → Rank contracts by): the chance of a profit 35, the spread 20, time decay 15,
    // delta near 0.60 8, open interest 8, reward to risk 7, typical-vol value 7.
    const prob = c.fitBy === 'prob';
    const p = {
      rr: clamp((rr - 0.5) / 3, 0, 1), edge: isNum(edge) ? clamp((edge + 0.2) / 0.5, 0, 1) : 0.5, spread: clamp(1 - (spr - 0.02) / 0.1, 0, 1),
      burn: clamp(1 - (burn - 0.05) / 0.3, 0, 1), be: clamp(1 - (beAtr - 0.25) / 1, 0, 1), liq: o.oi >= 1000 ? 1 : o.oi >= 300 ? 0.75 : o.oi >= 100 ? 0.5 : 0.25,
      delta: clamp(1 - Math.abs(ad - (prob ? 0.60 : 0.45)) / 0.25, 0, 1),
      pop: isNum(popHold) && isNum(popExp) ? 0.5 * clamp((popHold - 0.3) / 0.2, 0, 1) + 0.5 * clamp((popExp - 0.15) / 0.35, 0, 1) : 0
    };
    const wts = prob ? [['pop', 35, 'chance of profit'], ['spread', 20, 'spread'], ['burn', 15, 'time decay'], ['delta', 8, 'delta near 0.60'], ['liq', 8, 'open interest'], ['rr', 7, 'reward to risk'], ['edge', 7, 'typical-vol value']]
      : [['spread', 25, 'spread'], ['rr', 20, 'reward to risk'], ['burn', 20, 'time decay'], ['edge', 15, 'typical-vol value'], ['liq', 8, 'open interest'], ['delta', 7, 'delta near 0.45'], ['be', 5, 'break-even']];
    const score = isNum(rr) ? sum(wts.map(([k, w]) => w * p[k])) : 0;
    return { sym: o.sym, type, K: o.K, exp: o.exp, dte: o.T * 365, T: o.T, bid: o.bid, ask: o.ask, mid: o.mid, last: o.last, oi: o.oi, vol: o.vol, iv: o.iv, tkc,
      delta: g.delta, gamma: g.gamma, theta, vega: g.vega / 100, spr, entry, vStop, vTgt, risk, reward, rr, beS, beAtr, vTyp, edge, burn, backup, otgt,
      perC, qty, cost: qty * entry * 100, score, parts: p, wts, popHold, popExp, ok: !why.length, why };
  }
  function optionsFor(CR, dir, spot, plan, vr, cfg) {
    const c = Object.assign({}, CR.cfg, cfg || {});
    if (!plan || !plan.stop || !plan.target) return { list: [], best: null, n: 0 };
    const X = { cfg: c, spot, stop: plan.stop.stop, target: plan.target.target, vr, ivTyp: CR.ivTyp, tkc: CR.tkc };
    const list = [];
    CR.win.forEach(x => x.opts.forEach(o => { if (o.type === dir) { const ev = evalOption(o, X); if (ev) list.push(ev); } }));
    list.sort((a, b) => (b.ok - a.ok) || (b.score - a.score));
    const ok = list.filter(x => x.ok);
    return { list, ok, best: ok[0] || null, n: list.length, nOk: ok.length };
  }

  // ───────────────────────── your style: the stocks you trade ─────────────────────────
  // A setup can score well on a stock you shouldn't be trading: outside your price range, one that doesn't move enough
  // on a normal day to pay for a 1–4 day long option, implied vol too low (it won't move) or too high (premium and crush),
  // options priced well over what the stock usually does, or a spread too wide to get in and out. Each check says what it
  // found against what you set; any miss flags the stock.
  const STYLE_DEF = { pxMin: 10, pxMax: 60, moveMin: 2.5, ivMin: 0.25, ivMax: 1.0, ivRelMax: 1.25, liqMin: 'C' };
  const LIQ_ORDER = 'ABCDE';
  function liqRead(o, minOI) {
    if (!o || !o.ok || !o.ok.length) return { grade: 'E', n: 0 };
    const top = o.ok.slice(0, 8), spr = median(top.map(x => x.spr)), oi = median(top.map(x => x.oi));

  }
  const pct0 = (x) => (x * 100).toFixed(0) + '%';
  function styleFit(A, cfg) {
    const c = Object.assign({}, STYLE_DEF, cfg || {}), px = A.spot, vr = A.vr, CR = A.CR, out = [];
    const money = (x) => '$' + (Math.abs(x - Math.round(x)) < 1e-9 ? String(Math.round(x)) : (+x).toFixed(2));
    if (c.pxMin > 0 || c.pxMax > 0) {
      const lo = c.pxMin > 0 && px < c.pxMin, hi = c.pxMax > 0 && px > c.pxMax;
      out.push({ k: 'price', ok: !lo && !hi, short: lo || hi ? money(px) : '', tag: lo || hi ? 'price ' + money(px) : '', txt: lo ? 'Price ' + money(px) + ' is under your ' + money(c.pxMin) : hi ? 'Price ' + money(px) + ' is over your ' + money(c.pxMax) : 'Price ' + money(px) + ' in your ' + money(c.pxMin) + '–' + money(c.pxMax) + ' range' });
    }
    if (c.moveMin > 0) {
      const m = vr.adrTyp, ok = isNum(m) && m >= c.moveMin;
      out.push({ k: 'move', ok, short: ok ? '' : 'moves ' + (isNum(m) ? m.toFixed(1) + '%' : '?'), txt: isNum(m) ? 'Moves ' + m.toFixed(1) + '% on a normal day (the past year\'s median range' + (ok ? ')' : '; you want ' + c.moveMin + '%+)') + (isNum(vr.adrPct) && vr.adrPct < m * 0.7 ? '. Quieter lately: ' + vr.adrPct.toFixed(1) + '% over 20 days' : '') : 'Not enough history to read its normal range' });
    }
    if (!CR || !isNum(CR.ivW)) out.push({ k: 'iv', ok: false, short: 'no options', txt: 'No options quoted in your expiration window' });
    else {
      const iv = CR.ivW, lo = c.ivMin > 0 && iv < c.ivMin, hi = c.ivMax > 0 && iv > c.ivMax;
      out.push({ k: 'iv', ok: !lo && !hi, short: lo || hi ? 'IV ' + pct0(iv) : '', tag: lo ? 'IV low ' + pct0(iv) : hi ? 'IV high ' + pct0(iv) : '', txt: lo ? 'IV ' + pct0(iv) + ' is under your ' + pct0(c.ivMin) + ': options this quiet need a big move' : hi ? 'IV ' + pct0(iv) + ' is over your ' + pct0(c.ivMax) + ': rich premium and crush risk' : 'IV ' + pct0(iv) + ' in your ' + pct0(c.ivMin) + '–' + pct0(c.ivMax) + ' band' });
      if (c.ivRelMax > 0 && isNum(CR.ratio)) {
        const ok = Math.round(CR.ratio * 100) / 100 <= c.ivRelMax + 1e-9;           // judged on the number it shows
        out.push({ k: 'ivrel', ok, short: ok ? '' : 'IV ' + CR.ratio.toFixed(2) + '×', tag: ok ? '' : 'IV rich ' + CR.ratio.toFixed(2) + '×', txt: 'Options priced at ' + CR.ratio.toFixed(2) + '× the stock\'s typical volatility' + (ok ? '' : ' (your limit ' + c.ivRelMax + '×)') });
      }
    }
    if (c.liqMin && A.liq) {
      const ok = LIQ_ORDER.indexOf(A.liq.grade) <= LIQ_ORDER.indexOf(c.liqMin);
      // v1.13.6: say why: the median spread of the contracts COIL would pick, and when thin open interest cost a grade
      const L = A.liq, sp = isNum(L.spr) ? (L.spr * 100).toFixed(1) + '%' : '', W = liqWhy(L);
      const why = W.tooFew ? 'few quotes' : sp + (W.lowOI ? ', OI ' + Math.round(L.oi) : '');
      const det = W.tooFew ? (isNum(L.n) ? 'only ' + L.n + ' of the contracts you\'d trade have' : 'too few contracts have') + ' two-sided quotes to judge' + (sp ? ' (median spread ' + sp + ')' : '')
        : 'median ' + sp + ' of the mid across the ' + (L.n || '') + ' contracts COIL would pick' + (W.lowOI ? '; median open interest ' + Math.round(L.oi) + ' is under your minimum, which costs a grade' : '');

  const SECTOR_NAME = { XLF: 'Financials', XLK: 'Technology', XLV: 'Health Care', XLE: 'Energy', XLU: 'Utilities', XLY: 'Cons. Discretionary', XLP: 'Cons. Staples',
    XLI: 'Industrials', XLB: 'Materials', XLC: 'Communication', XLRE: 'Real Estate' };

  const SECTOR_OF = {};
  Object.keys(SECTOR_SRC).forEach(k => { SECTOR_SRC[k].split(/\s+/).forEach(s => { SECTOR_OF[s] = k; }); SECTOR_OF[k] = k; SECTOR_OF[SECTOR_EW[k]] = k; });
  const MARKET_FUNDS = new Set(['SPY', 'QQQ', 'IWM', 'DIA', 'RSP', 'QQEW', 'VOO', 'IVV', 'VTI', 'VIX', 'UVXY', 'VXX', 'TLT', 'UUP', 'GLD', 'SLV', 'TQQQ', 'SQQQ', 'SPXL', 'SPXS']);
  // residual-return correlation over the last 120 shared days: stock vs each sector, both with SPY's share removed
  function sectorByCorr(stock, sectors, spy) {
    const days = Object.keys(stock).filter(d => spy[d] > 0).sort();
    const res = (m) => {
      const ds = days.filter(d => m[d] > 0), out = {};
      for (let i = 1; i < ds.length; i++) out[ds[i]] = [Math.log(m[ds[i]] / m[ds[i - 1]]), Math.log(spy[ds[i]] / spy[ds[i - 1]])];
      return out;
    };
    const resid = (pairs) => { const xs = pairs.map(p => p[1]), ys = pairs.map(p => p[0]), lr = linreg(xs, ys); return lr ? pairs.map(p => p[0] - (lr.intercept + lr.slope * p[1])) : null; };
    const s = res(stock), by = [];
    for (const k of Object.keys(sectors || {})) {
      const r = res(sectors[k]), ds = Object.keys(s).filter(d => r[d]).sort().slice(-120);
      if (ds.length < 40) continue;
      const a = resid(ds.map(d => s[d])), b = resid(ds.map(d => r[d]));
      if (!a || !b) continue;
      const lr = linreg(a, b);
      if (lr) by.push({ code: k, r: lr.r });
    }
    by.sort((x, y) => y.r - x.r);
    return { code: by.length && by[0].r >= 0.25 ? by[0].code : '', r: by.length ? by[0].r : NaN, by };
  }

  // ───────────────────────── one ticker, read end to end ─────────────────────────

  // COIL's own sale: at the stock stop (auto-sell) or SELL NOW. Tradier's orders are read first (a sale of ours may already

  async function runSale(t, kind) {

      return;

    if (!brokerReady()) { flash(tradeBlock(), true); return; }

      if (!(bid > 0)) { hold('no bid on ' + t.sym + ', and COIL won\'t sell into an empty market — the exits stay at Tradier'); return; }

  // COIL's working sale: its fills on Tradier's numbers; while it works, it follows the bid down, and when it sits at the

  async function pollSales() {
    for (const t of openTrades()) {

      const s = b.sell, o = await orderSafe(s.id);

      if (s.await) { s.await = 0; if (/waiting for its fill price/.test(b.note || '')) b.note = ''; }
      if (settle(t)) continue;

        else { b.note = 'The sale was ' + o.status + (o.reason ? ': ' + o.reason : '') + ' — nothing sold'; flash(tradeLabel(t) + ' — ' + b.note, true); }

  // the resting exits: read every 10 s — every 5 s while the stock is through its stop, every round while a fill's numbers are due
  async function pollExits() {

      if (!awaiting(b.exit) && Date.now() - (b.exit.checked || 0) < (t.hit && t.hit.n > 0 ? 5e3 : 10e3)) continue;

      else if (x.status === 'expired' && x.kind === 'limit-day') { b.note = 'Today\'s take-profit expired — it goes back in at the next open'; b.reGo = 1; b.reGoAt = E.nextSessionOpen(Date.now()); }

  // positions: a trade bought here is confirmed the first time it shows up at Tradier. One whose contract Tradier stops

  // minute while the market is open (or once the contract has expired), nothing of COIL's selling or on its way, and

  async function reconcile() {
    const fl = openTrades().filter(t => t.bk && !t.bk.closed && acctOk(t));
    if (!fl.length) return;
    const waiting = fl.some(t => t.bk.posAt === null && !t.bk.posWarn);
    if (Date.now() - BK.recAt < (waiting ? 3e3 : 14e3)) return;

    const open = marketOpen();

  // auto-sell's standing duties: exits for trades that lack them, a new take-profit swapped in, a day order back at the

  // ── the stock-stop watch (on every 5-second quote)
  const minsIntoSession = (ms) => { const p = E.etParts(ms); return p.hh * 60 + p.mm - 570; };

  function trailStop(t) {

  function tradeWatch() {

      if (oq && now - qa < 15e3) t.live = { bid: +oq.bid, ask: +oq.ask, last: +oq.last, at: qa };
      t.hit = t.hit || { n: 0, at: 0 };

      flash(what + ' — ' + (!S.settings.autoSell ? 'SELL NOW on the trade (auto-sell is off)'

  // an option stop: the option's own quote (its middle) at or under the stop, on confirmN fresh quotes 4 s or more

  function optWatch(t, oq, qa, now, open) {

  // trailing on the option: once it's up as much as the stop risked (1R), the stop moves to your entry (break-even) or

  async function linkPosition(p, stop, otgtIn, add) {

  // ───────────────────────── SETUP ALERTS ─────────────────────────

  async function fetchTickerNews(sym) {

  // the US economic calendar, this week and next: high- and medium-impact releases

  async function chnPick(sym) {

    if (!(S.cur && S.cur.sym === und && S.cur.A)) {
      CHN.own = ''; flash('Putting ' + und + ' on the chart for its stop and target…', 'info');
      await loadTicker(und);

      if (!(S.cur && S.cur.sym === und && S.cur.A)) { flash('Couldn\'t read ' + und + ' for a plan' + (S.cur && S.cur.err ? ': ' + S.cur.err : ''), true); return; }

      if (!(bid > 0 && ask >= bid)) { flash('No two-sided quote on that contract right now', true); return; }
      const cfg = Object.assign({}, A.CR.cfg, engineCfg().opt), T = (E.expiryMs(exp) - Date.now()) / (365 * 864e5), mid = (bid + ask) / 2;

  // ── Guide

      + '<h2>Cheap options</h2><p>Cheap means the implied vol in your ' + s.dteMin + '–' + s.dteMax + ' day window is low against what the stock itself usually does: IV against its median 20-day HV over the past year, where today\'s IV ranks among the past year\'s HV readings, and — once COIL has logged 20 days of it — the IV\'s rank in its own history. 100 is very cheap. Coiled stocks tend to carry cheap options; buying then, before the coil fires, is the setup. When the term structure shows an event (likely earnings) inside the window, the score is marked down: that IV is up for a reason.</p>'
      + '<p>Each contract is priced for your plan: the stock at your stop and at your target after a ' + s.hold + '-day hold at the contract\'s own IV, selling at the bid. Its fit score (out of 100) weighs the spread most (25), then reward to risk and time decay over the hold (20 each), its value at the stock\'s typical vol against its price (15), open interest (8), a delta near 0.45 (7) and the stock move it needs to break even (5). Settings → Options → Rank contracts by → Probability puts the chance of a profit first instead (35), then the spread (20) and time decay (15), and favors a delta near 0.60. Each card\'s <b>chance of profit</b> comes from the contract\'s own IV, the market\'s estimate of how far the stock moves: the stock past your break-even after your hold, and past the strike plus what you paid at expiry. It takes no view on direction, so COIL\'s read of the setup isn\'t in it. Scores from before v1.13.14 weighed reward to risk most, so they ran higher. Contracts outside your delta, spread, open-interest or premium filters are listed apart.</p>'
      + '<h2>The stop, the take-profit, the backup and the size</h2><ul><li><b>Stock stop</b>: outside the largest of ' + s.atrMult + '× ATR (gaps included), ' + s.adrMult + '× ADR (the intraday travel) and a ' + s.ivMult + '× 1σ move over your hold at today\'s IV. If structure sits just past that (within ' + s.stopReach + ' ATR) — a 20/90-day profile level, the HMA cloud, the Zig Zag channel, the 20-day swing, a support zone\'s bottom (calls) or a resistance zone\'s top (puts) — the stop goes 0.2 ATR behind it. A 30% stop on a cheap option is usually one ordinary red day; this one is where the move says you\'re wrong.</li>'

      + '<li>With auto-sell on, the take-profit and the backup rest at Tradier as one pair (OCO), good till canceled, sized to what you hold less anything else already working to sell it. If Tradier won\'t pair them, the take-profit rests alone and the stock stop still works while COIL is open. A backup can never rest at or over the bid: after decay takes the option under it, it goes in 25% under the bid.</li>'

      + '<h2>How far the stop sits</h2><ul><li>On a 1–4 day hold of a 2–4 week, delta-0.5 option, ordinary noise alone takes it down a long way before your idea plays out. In a test of 20,000 simulated trades (the stock moving at the option\'s own IV, a take-profit at +60% to +100%), a stop 30% under what you paid was hit on 47–65% of trades, 40% on 34–53%, 50% on 23–40%, 60% on 14–27%. With an edge (the stock drifting your way), every step tighter than 60% gave up profit: about 1–2 points per trade at 50%, 4–5 at 40%, 8–9 at 30%. So COIL keeps its option stop between 30% and 60%, and the contract count (not a tight stop) is what limits each loss.</li>'

      lines.push('  ' + clockT(s.at) + '  ' + perfFmt(s.ms) + ' frozen — ' + (s.hidden ? 'tab in the background; ' : '') + (share >= 0.6 ? 'COIL: ' : share >= 0.2 ? 'partly COIL: ' : 'not COIL\'s timed work (the browser, another tab or the computer): ')
        + (s.what.length ? s.what.map(w => w.name + ' ' + perfFmt(w.ms) + (w.n > 1 ? ' in ' + w.n + ' runs' : '') + (w.extra ? ' (' + w.extra + ')' : '')).join(', ') : 'nothing COIL timed'));
    });
    lines.push('Time by part since load (runs · total · longest):');
    Object.entries(PERF.tot).sort((a, b) => b[1].ms - a[1].ms).slice(0, 22).forEach(([k, z]) => lines.push('  ' + k + ': ' + z.n + ' · ' + perfFmt(z.ms) + ' · ' + perfFmt(z.max)));
    const sz = (k) => { try { const v = store.get(k, null); return v == null ? 0 : JSON.stringify(v).length; } catch (e) { return 0; } };
    lines.push('Stored: trades ' + (sz(KEY.trades) / 1024).toFixed(0) + ' KB, journal ' + (sz(KEY.journal) / 1024).toFixed(0) + ' KB, drawings ' + (sz(KEY.draw) / 1024).toFixed(0) + ' KB, IV history ' + (sz(KEY.ivh) / 1024).toFixed(0) + ' KB, news ' + (sz(KEY.news) / 1024).toFixed(0) + ' KB');
    lines.push('Chart: ' + S.ui.tf + ', ' + (CH.data && CH.data.bars ? CH.data.bars.length : 0) + ' bars; scan list ' + symList(S.settings.scanList, LIST_MAX).length + ' tickers; screen ' + window.innerWidth + '×' + window.innerHeight + ' at ' + (window.devicePixelRatio || 1) + '×');
    return lines.join('\n');
  }
  function perfSection(inner) {
    const st = PERF.stalls, worst = st.reduce((m, s) => Math.max(m, s.ms), 0);
    return (inner ? '<div class="perf">' : '<div class="fs perf"><h2>Speed check</h2>') + '<p class="lede">If the page freezes, open this after it happens: it shows what COIL was doing during each freeze. Copy the report and send it to me.</p>'
      + '<p>' + (st.length ? st.length + ' freeze' + (st.length === 1 ? '' : 's') + ' since load, the worst ' + perfFmt(worst) + '.' : 'No freezes since load.') + '</p>'
      + '<textarea class="perfout" readonly rows="14" spellcheck="false">' + esc(perfReport()) + '</textarea>'
      + '<div class="acts" style="display:flex;gap:6px;margin-top:6px"><button class="btn sm" data-act="perf-copy">Copy the report</button><button class="btn sm" data-act="perf-refresh">Refresh</button><button class="btn sm" data-act="perf-clear">Clear</button></div></div>';
  }

  // ───────────────────────── boot ─────────────────────────
  function boot() {
    if (!document.body) { setTimeout(boot, 50); return; }
    perfStart();
    // a phone opens on your positions; a tablet folds the scanner (and, narrow, the panel) to strips the chart can use
    const vw = window.innerWidth || 1400;
    if (vw <= 760) { S.ui.page = 'pocket'; S.ui.pk = 'pos'; S.ui.railC = true; S.ui.inspC = true; }
    else if (vw <= 1180) { S.ui.railC = true; if (vw <= 1000) S.ui.inspC = true; }
    mount();
    render();
    startLive();
    setInterval(renderClock, 15e3);
    setInterval(autoScanTick, 30e3);
    setInterval(() => { if (S.settings.tradeOn && store.get(KEY.tradier, '')) haveLease(); }, 5e3);     // the one-tab hold, kept fresh
    setTimeout(newsLoop, 1500);
    wlsStart();
    extStart();                                                                                           // pre-market and after-hours prices                                                                                           // your watchlists, in step with Tradier                                                                           // news needs no Tradier token
    if (store.get(KEY.tradier, '')) {
      loadTicker(S.ui.sym || 'SPY');
      ensureMarket();
      setTimeout(slowTick, 1500);
      if (S.settings.tradeOn) loadAccount(true).then(() => { if (S.ui.page === 'pocket') pkRefresh(true); }).catch(() => {});
      else if (S.trades.length) scheduleBK(1000);
    }
    poDeepLink();                                                                                         // opened from a phone alert
    // the app's insides on the page's window — for the test harness, or with hc_coil_debug set in Tampermonkey storage.
    // In normal use nothing on the page can reach them (money-moving clicks still need your own events either way).
    if ((typeof GM_info === 'undefined' && !WEB) || store.get(KEY.debug, false) === true)
      window.hcCOIL = { version: VERSION, state: S, CHN, chnLoad, chnSet, RL, rlRate, MK, ensureBasket, VW, watchPositions, WLS, wlsStatus, catchUp, BV, bvGet, bvPut, bvFlush, bvStats, refreshIntra, gradeChip, scanOne, gexExps, pickChainExps, saSweep, saRefresh, SA, openRiskUSD, backupUnder, WLS, wlSync, wlsMerge, alertCheck, EXT, extOf, extTick, E, CH, BK, NW, loadTicker, runScan, analyzeCur, render, ensureMarket, fastTick, slowTick, tradeWatch, openTrades, renderPage, newsRefresh, chartStats: () => CST, drawChart, chartCols: () => Object.assign({}, CC), candleSet, gxv: () => Object.assign({}, GXV), chartEvents, DR, thesisOf };
  }
  boot();
})();

})();
